<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    .nf h1 { font-size: clamp(64px, 14vw, 200px); line-height: .9; letter-spacing: -.055em; }
    .nf p { color: var(--ink-2); font-size: 19px; max-width: 40ch; }
  </style>
</head>
<body>
  <main class="container nf">
    <p class="mono" style="color:var(--ink-3)">Error 404</p>
    <h1>Lost the <em>signal</em>.</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div><a class="btn btn--solid" href="index.html">Back to the homepage</a></div>
  </main>
</body>
</html>
